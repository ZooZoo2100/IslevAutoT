<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 190" role="img" aria-labelledby="title desc">
  <title id="title">Islev Auto Teknik</title>
  <desc id="desc">Islev Auto Teknik logo med blåt teknisk mærke, integreret skruenøgle og hvid wordmark.</desc>
  <defs>
